<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="theme-color" content="#0D0F21">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Hábitos</title>
<style>
:root{
  --bg:#F3F4FB;--card:#FFFFFF;--card2:#ECEEF8;--text:#141733;--muted:#6E7396;--line:rgba(20,23,51,.09);
  --accent:#6C5CE7;--accent-b:#A55EEA;--accent2:#00C2A8;--gold:#FFB020;--fire:#FF7A1A;--danger:#FF4D6A;--ok:#20C374;
  --shadow:0 6px 20px rgba(36,40,100,.07);--r:20px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0D0F21;--card:#171A35;--card2:#232750;--text:#F1F2FF;--muted:#9097C4;--line:rgba(255,255,255,.08);--shadow:0 6px 20px rgba(0,0,0,.28);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;font-size:16px;color:var(--text)}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:520px;margin:0 auto;padding:0 16px calc(104px + var(--safe-b))}

/* ---------- Encabezado / nivel ---------- */
.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(var(--safe-t) + 10px) 16px 12px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px)}
.lvl{display:flex;align-items:center;gap:12px}
.lvl-badge{position:relative;flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--card2) 0)}
.lvl-badge::before{content:"";position:absolute;inset:4px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-b))}
.lvl-badge span{position:relative;color:#fff;font-weight:800;font-size:18px}
.lvl-info{flex:1;min-width:0}
.lvl-t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:5px 0 3px}
.xpbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--fire))}
.xp-t{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--ok)}.sync.pend .dot{background:var(--gold)}.sync.err .dot{background:var(--danger)}
.sync.busy .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- Vistas ---------- */
.view{display:none}
.view.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hello{margin:4px 2px 14px}
.hello h1{font-size:30px;margin:0;letter-spacing:-.02em;line-height:1.1}
.hello p{margin:0 0 2px;color:var(--muted);font-size:14px;font-weight:600}
.hello p.after{margin:4px 0 0}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 9px;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.day .dl{font-size:11px;font-weight:700;color:var(--muted)}
.mring{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--card2) 0)}
.mring b{width:23px;height:23px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:11.5px;font-weight:800}
.day.perf .mring{background:var(--gold)}
.day.sel{background:var(--accent)}
.day.sel .dl{color:#fff}
.day.sel .mring b{background:var(--accent);color:#fff}

/* Resumen del día */
.sum{display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#5B4BDB,#8E7CFF 55%,#18C3B0);box-shadow:0 12px 28px rgba(108,92,231,.33);margin-bottom:6px}
.ring{position:relative;flex:0 0 84px;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.rbg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:9}
.rfg{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:22px;line-height:1}.rc small{font-size:10.5px;opacity:.85;font-weight:600}
.sumt{display:flex;flex-direction:column;gap:3px;min-width:0}
.sumt b{font-size:18px}.sumt span{font-size:13.5px;opacity:.92}
.sumt em{font-style:normal;font-size:12.5px;font-weight:700;margin-top:4px;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:99px;align-self:flex-start}
.past{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--gold) 20%,var(--card));font-size:13px;font-weight:700;margin-bottom:12px}
.past button{color:var(--accent);font-weight:800}

.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 9px;font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* Tarjeta de hábito */
.hcard{--c:#6C5CE7;display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;transition:transform .15s}
.hcard:active{transform:scale(.985)}
.hcard.ok{background:color-mix(in srgb,var(--c) 15%,var(--card))}
.hcard.fail{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--danger) 65%,transparent)}
.hcard.off{opacity:.55}
.hcard.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hemoji{flex:0 0 48px;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--c) 20%,transparent)}
.hemoji.sm{flex-basis:40px;width:40px;height:40px;font-size:21px;border-radius:13px}
.hinfo{flex:1;min-width:0}
.hname{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.hsub .fire{color:var(--fire);font-weight:800}
.pbar{display:block;height:6px;border-radius:99px;background:var(--card2);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.pbar.warn i{background:var(--gold)}.pbar.over i{background:var(--danger)}
.zero{margin-top:7px;font-size:12px;font-weight:800;color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent);padding:5px 10px;border-radius:99px}
.chk{flex:0 0 46px;width:46px;height:46px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--c) 55%,var(--line));display:grid;place-items:center;font-size:24px;color:transparent;transition:background .2s,border-color .2s}
.chk.on{background:var(--c);border-color:var(--c);color:#fff}
.duo{display:flex;gap:6px}
.duo button{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:20px;color:var(--muted)}
.duo .ok.on{background:var(--ok);color:#fff}.duo .bad.on{background:var(--danger);color:#fff}
.stp{display:flex;align-items:center;gap:3px;background:var(--card2);border-radius:14px;padding:3px}
.stp button{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px}
.stp .pl{background:var(--c);color:#fff}
.stp .vv{width:auto;min-width:48px;padding:0 3px;font-weight:800;font-size:15px;line-height:1.05;display:block}
.stp .vv small{display:block;font-size:9.5px;font-weight:700;color:var(--muted)}
.just .chk.on,.just .duo .on,.just .stp .vv{animation:pop .38s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.frase{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin:22px 10px 0}

/* Vacío */
.empty{text-align:center;padding:36px 18px}
.empty .ee{font-size:68px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.empty h2{margin:10px 0 6px;font-size:22px}
.empty p{color:var(--muted);margin:0 0 20px;font-size:14.5px;line-height:1.45}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + var(--safe-b));background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar>button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);width:62px}
.tabbar>button svg{width:24px;height:24px}
.tabbar .on{color:var(--accent)}
.tabbar .fab{width:58px;height:58px;border-radius:20px;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-b));box-shadow:0 10px 24px rgba(108,92,231,.45);margin-top:-28px}
.tabbar .fab svg{width:28px;height:28px;stroke-width:2.8}

/* Panel inferior (sheet) */
#backdrop{position:fixed;inset:0;background:rgba(5,6,20,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:28px 28px 0 0;z-index:50;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--muted);opacity:.35;margin:9px auto 2px;flex:0 0 auto}
#sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px calc(18px + var(--safe-b));overscroll-behavior:contain}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px}
.sh-head h2{margin:0;font-size:21px;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.xbtn{flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:17px;color:var(--muted)}

/* Asistente */
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--card2)}
.steps i.on{background:var(--accent)}
.q{font-size:23px;font-weight:800;margin:2px 0 4px;letter-spacing:-.01em}
.qs{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.4}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;border:2px solid transparent}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.opt .oe{font-size:32px;flex:0 0 auto}
.opt b{display:block;font-size:16px}
.opt small{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tpl{padding:14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);text-align:left;border-top:4px solid var(--c)}
.tpl .te{font-size:28px;display:block}
.tpl b{display:block;font-size:14px;margin-top:6px;line-height:1.2}
.tpl small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.field{margin-bottom:18px}
.field>label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 2px 7px}
.inp{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:none}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.egrid button{aspect-ratio:1;border-radius:12px;font-size:22px;background:var(--card)}
.egrid .on{background:color-mix(in srgb,var(--accent) 22%,var(--card));box-shadow:inset 0 0 0 2px var(--accent)}
.cgrid{display:flex;flex-wrap:wrap;gap:12px;padding:4px}
.cgrid button{width:34px;height:34px;border-radius:50%}
.cgrid .on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 6px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted)}
.seg .on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg.big button{padding:16px 6px;font-size:15px}
.seg .on.ok{background:var(--ok);color:#fff}.seg .on.bad{background:var(--danger);color:#fff}
.nstep{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.nstep button{flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:18px}
.nstep .nv{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px;min-width:0}
.ninp{width:100%;max-width:84px;border:0;background:none;text-align:center;font-weight:800;font-size:20px;outline:none;padding:6px 0}
.nstep .nv span{color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
.dias{display:flex;gap:6px}
.dias button{flex:1;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:800;color:var(--muted)}
.dias .on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:14px}
.chips .on{background:var(--accent);color:#fff}
.chips.sm{margin-top:8px}.chips.sm button{padding:6px 11px;font-size:12.5px;color:var(--muted)}
.chips.center{justify-content:center;margin-top:12px}
.hint{color:var(--muted);font-size:12.5px;margin:7px 2px 0;line-height:1.4}
.tog{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14.5px}
.tog i{width:46px;height:28px;border-radius:99px;background:var(--card2);position:relative;transition:.2s;flex:0 0 auto}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.tog.on i{background:var(--ok)}.tog.on i::after{left:21px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.preview{pointer-events:none}
.foot{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:calc(-18px - var(--safe-b));padding:12px 0 calc(18px + var(--safe-b));margin-bottom:calc(-18px - var(--safe-b));background:linear-gradient(to bottom,transparent,var(--bg) 26%)}
.btn{flex:1;padding:15px 12px;border-radius:16px;font-weight:800;font-size:15.5px;background:var(--card2);text-align:center}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-b));color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.33)}
.btn.danger{color:var(--danger)}
.btn.wide{display:block;width:100%;margin-top:10px}

/* Editor de día */
.bignum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 4px}
.rb{flex:0 0 58px;width:58px;height:58px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:24px}
.rb.pl{background:var(--accent);color:#fff}
.bn{flex:1;text-align:center;min-width:0}
.bninp{width:100%;border:0;background:none;text-align:center;font-weight:900;font-size:46px;outline:none;padding:0;letter-spacing:-.02em}
.bn span{display:block;color:var(--muted);font-weight:700;font-size:14px}

/* Detalle */
.dhead{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.dhead .hemoji{flex-basis:60px;width:60px;height:60px;font-size:32px;border-radius:19px}
.dhead h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead p{margin:3px 0 0;color:var(--muted);font-size:13px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{padding:13px 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.tile .tv{font-size:24px;font-weight:900;letter-spacing:-.01em;margin-top:2px}
.tile .tl{font-size:12px;color:var(--muted);font-weight:700}
.card{padding:16px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15.5px}
.goal .gt{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:8px}
.goal .pbar{height:12px}
.goal .pbar i{background:linear-gradient(90deg,var(--gold),var(--fire))}
.hwrap{display:grid;grid-template-columns:14px 1fr;column-gap:5px}
.hmon{grid-column:2;display:grid;grid-template-columns:repeat(var(--w),1fr);gap:3px;margin-bottom:4px}
.hmon span{font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:visible;text-transform:capitalize}
.hdow{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.hdow span{font-size:9.5px;font-weight:800;color:var(--muted);display:grid;place-items:center}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--card2);display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700;color:var(--muted);line-height:1;overflow:hidden}
.heat i.ok,.heat i.bad,.heat i.l3,.heat i.l4{color:#fff}
.heat i.ok{background:var(--c,var(--accent))}
.heat i.part{background:color-mix(in srgb,var(--c,var(--accent)) 40%,var(--card2))}
.heat i.bad{background:var(--danger)}
.heat i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat i.fut{background:transparent}
.heat i.pre{background:var(--card2);opacity:.35}
.heat i.l1{background:color-mix(in srgb,var(--accent2) 30%,var(--card2))}
.heat i.l2{background:color-mix(in srgb,var(--accent2) 55%,var(--card2))}
.heat i.l3{background:color-mix(in srgb,var(--accent2) 80%,var(--card2))}
.heat i.l4{background:var(--gold)}
.heat i.today{outline:2px solid var(--text);outline-offset:1px}
.hlegend{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:10px;font-size:11px;color:var(--muted);font-weight:700}
.hlegend i{width:11px;height:11px;border-radius:3px;background:var(--card2)}
.hlegend i.ok{background:var(--c,var(--accent))}.hlegend i.bad{background:var(--danger)}

/* ---------- Panel inferior ---------- */
function openSheet(type) {
  ui.sheet = type; renderSheet(false);
  $('#sheet-body').scrollTop = 0;
  $('#sheet').classList.add('open'); $('#backdrop').classList.add('open'); document.body.classList.add('noscroll');
}
function closeSheet() {
  ui.sheet = null; ui.edBack = false;
  $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('open'); document.body.classList.remove('noscroll');
  if (ui.nivelPendiente) { const lv = ui.nivelPendiente; ui.nivelPendiente = null; setTimeout(() => abrirNivel(lv), 450); }
}
function renderSheet(keep = true) {
  const b = $('#sheet-body'), top = b.scrollTop; let html = '';
  if (ui.sheet === 'detalle') { const h = habitById(ui.detId); if (!h) { closeSheet(); return; } html = detalleHTML(h); }
  else if (ui.sheet === 'editor') { const h = ui.ed && habitById(ui.ed.id); if (!h) { closeSheet(); return; } html = editorHTML(h); }
  else if (ui.sheet === 'wizard') html = wizardHTML();
  else if (ui.sheet === 'nivel') html = nivelHTML(ui.nivelNuevo);
  b.innerHTML = html;
  if (keep) b.scrollTop = top;
}

/* Detalle de hábito */
function detalleHTML(h) {
  const s = S(h), t = today();
  const tile = (e, v, l) => `<div class="tile"><div class="tl">${e} ${l}</div><div class="tv">${v}</div></div>`;
  const desc = { check: h.polaridad === 'dejar' ? 'Marcas ✓ si lo evitaste o ✗ si caíste' : 'Palomita diaria', cantidad: 'Contador · ' + metaTxt(h), tiempo: 'Tiempo · ' + metaTxt(h) }[h.tipo];
  let tiles = tile(h.polaridad === 'dejar' ? '🛡️' : '🔥', s.streak, 'Racha actual') + tile('🏆', s.best, 'Mejor racha')
    + tile('✅', s.pct30 + '%', 'Cumplimiento 30 d') + tile('📅', s.totalOk, 'Días logrados');
  if (h.tipo !== 'check') tiles += tile('📊', vLong(h, s.avg7), 'Promedio diario 7 d') + tile('Σ', vLong(h, s.sum30), 'Total 30 días');
  if (h.extraEtiqueta) tiles += tile('➕', fmtNum(r2(s.avgEx7)), esc(cap(h.extraEtiqueta)) + ' / día');
  if (h.polaridad === 'dejar') tiles += tile('⏳', s.ultFail ? diffDays(s.ultFail, t) + ' d' : '—', s.ultFail ? 'Desde la última recaída' : 'Sin recaídas');
  let goal = '';
  if (h.rachaObjetivo > 0) {
    const g = h.rachaObjetivo, done = s.best >= g, cur = Math.min(s.streak, g);
    goal = `<div class="card goal"><div class="gt"><span>🏆 Meta: racha de ${g} días</span><span>${done ? '¡Lograda!' : cur + '/' + g}</span></div>
      <span class="pbar"><i style="width:${done ? 100 : Math.round(cur / g * 100)}%"></i></span>
      <p class="hint">${done ? `Tu mejor racha fue de ${s.best} días. ¿Subes la meta?` : `Te ${g - cur === 1 ? 'falta 1 día' : 'faltan ' + (g - cur) + ' días'}. Tú puedes.`}</p></div>`;
  }
  const heat = heatGrid(f => { const st = dayStatus(h, f); if (st === 'ok') return 'ok'; if (st === 'fail') return 'bad'; if (st === 'partial') return 'part';
    if (f < firstDate(h)) return 'pre'; if (!isSched(h, f)) return 'off'; return ''; }, h.id);
  let bars = '';
  if (h.tipo !== 'check') {
    const ds = [...Array(14)].map((_, i) => addDays(t, i - 13));
    const vals = ds.map(f => { const r = getReg(h.id, f); return r ? num(r.valor) : 0; });
    const mx = Math.max(num(h.meta), ...vals, 1);
    bars = `<div class="card"><h3>Últimos 14 días</h3><div class="bw">
      ${h.meta ? `<div class="mline" style="bottom:${h.meta / mx * 100}%"><span>${h.direccion === 'max' ? 'Límite' : 'Meta'}</span></div>` : ''}
      ${ds.map((f, i) => { const st = dayStatus(h, f); return `<div class="b ${st === 'fail' ? 'bad' : ''} ${vals[i] === 0 ? 'zero' : ''}"><i style="height:${Math.max(3, vals[i] / mx * 100)}%"></i></div>`; }).join('')}
      </div><div class="blab">${ds.map(f => `<span>${pYmd(f).getDate()}</span>`).join('')}</div></div>`;
  }
  return `<div style="--c:${h.color}"><div class="sh-head"><div class="dhead"><div class="hemoji">${esc(h.emoji)}</div>
    <div style="min-width:0"><h2>${esc(h.nombre)}</h2><p>${h.polaridad === 'dejar' ? '🛡️ Por dejar' : '🌱 Por construir'} · ${desc} · ${freqTxt(h.dias)}</p></div></div>
    <button class="xbtn" data-action="cerrar">${ICON.x}</button></div>
    <div class="tiles">${tiles}</div>${goal}
    <div class="card"><h3>Historial</h3>${heat}<div class="hlegend"><span class="sp">Toca un día para editarlo</span><i class="ok"></i><span>Logrado</span><i class="bad"></i><span>Falló</span></div></div>
    ${bars}
    <div class="dact"><button class="btn" data-action="hEditar" data-id="${h.id}">✏️ Editar</button><button class="btn" data-action="hArchivar" data-id="${h.id}">🗄️ Archivar</button></div>
    <button class="btn wide danger" data-action="hBorrar" data-id="${h.id}">Eliminar hábito</button></div>`;
}

/* Asistente de creación / edición */
function abrirWizard(h) {

const opt = (act, v, e, t, d, on) => `<button class="opt ${on ? 'on' : ''}" data-action="${act}" data-v="${v}"><span class="oe">${e}</span><span><b>${t}</b><small>${d}</small></span></button>`;

  <button data-action="wStep" data-f="${f}" data-d="1">${ICON.plus}</button></div>`;

  const dots = `<div class="steps">${[1, 2, 3, 4].map(i => `<i class="${i <= p ? 'on' : ''}"></i>`).join('')}</div>`;

function paso4HTML(d) {

  s += fld('Meta de racha 🏆', `<div class="chips">${[0, 7, 21, 30, 66, 100].map(n => `<button class="${num(d.rachaObjetivo) === n ? 'on' : ''}" data-action="wRacha" data-v="${n}">${n ? n + ' días' : 'Sin meta'}</button>`).join('')}</div>

function previewCard(d) {

  else ctrl = `<div class="stp"><button>${ICON.minus}</button><span class="vv">0<small>${d.direccion === 'max' ? 'máx ' : 'de '}${vShort(d, num(d.meta))}</small></span><button class="pl">${ICON.plus}</button></div>`;

function wGuardar() {
  const d = ui.draft;
  if (!String(d.nombre || '').trim()) { ui.paso = 2; renderSheet(false); toast('Ponle un nombre a tu hábito 🙂'); return; }
  if (!d.dias) { toast('Elige al menos un día'); return; }
  let meta = num(d.meta);
  if (d.tipo !== 'check' && d.direccion === 'min' && meta < 1) meta = 1;
  const h = normHabit({ ...d, nombre: d.nombre.trim(), meta: d.tipo === 'check' ? 0 : meta,
    unidad: d.tipo === 'tiempo' ? 'min' : d.tipo === 'check' ? '' : String(d.unidad || '').trim(),
    extraEtiqueta: d.tipo === 'cantidad' && d._extra ? (String(d.extraEtiqueta || '').trim() || 'extra') : '',
    extraPorUnidad: d.tipo === 'cantidad' && d._extra ? num(d.extraPorUnidad) : 0,
    dias: ordenDias(d.dias), actualizado: new Date().toISOString() });
  if (!ui.editando) { h.id = uid(); h.creado = today(); h.orden = Math.max(0, ...state.habitos.map(x => x.orden || 0)) + 1; h.archivado = false; }
  commit({ t:'habito', h });
  closeSheet();
  if (!ui.editando) { ui.vista = 'hoy'; ui.fecha = today(); render(); toast(`${esc(h.emoji)} ¡Hábito creado! A construir esa racha`); confetti(innerWidth / 2, innerHeight * .4, 90); }
  else toast('Cambios guardados ✅');
  checkProgress(true);
}

/* ---------- Gamificación: efectos ---------- */
function accion(el, h, f, fn) {
  const rect = el.getBoundingClientRect();
  const antes = dayStatus(h, f), rA = dayRatio(f, true), perfA = rA.total && rA.done === rA.total;
  ui.justId = h.id;
  fn();
  ui.justId = null;
  const desp = dayStatus(h, f);
  if (antes !== 'ok' && desp === 'ok') {
    celebrar(rect, h);
    const rD = dayRatio(f, true);
    if (!perfA && rD.total > 1 && rD.done === rD.total) setTimeout(() => { confetti(innerWidth / 2, innerHeight * .3, 170); toast('⭐ ¡Día perfecto! Cumpliste todos tus hábitos', 'big'); }, 450);
  } else if (desp === 'fail' && antes !== 'fail') {
    if (h.tipo === 'check') toast('Está bien. Reconocerlo ya es avanzar 💪 Mañana empiezas de nuevo');
    else toast(`😬 Te pasaste: ${metaTxt(h)}`);
    const c = document.querySelector(`.hcard[data-id="${h.id}"]`); if (c) c.classList.add('shake');
  }
  checkProgress(true);
}
function celebrar(rect, h) {
  const x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
  confetti(x, y, 45, [h.color, '#FFB020', '#00C2A8', '#FFFFFF', '#FF7A1A']);
  const s = S(h), bonus = s.streak >= 30 ? 10 : s.streak >= 7 ? 5 : 0;
  xpFloat(x, y - 10, `+${10 + bonus} XP`);
  if (s.streak > 1 && [3, 7, 14, 21, 30, 50, 66, 100, 150, 200, 365].includes(s.streak)) setTimeout(() => toast(`🔥 ¡${s.streak} días seguidos con ${esc(h.nombre)}!`, 'big'), 300);
  try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}
}
function checkProgress(cel) {
  CACHE = {};
  const g = G();
  if (!seen.init) { seen = { init:true, logros:g.logros.filter(l => l.ok).map(l => l.id), nivel:g.nivel }; save(K.seen, seen); return; }
  const nuevos = g.logros.filter(l => l.ok && !seen.logros.includes(l.id));
  if (nuevos.length) {
    seen.logros.push(...nuevos.map(l => l.id));
    if (cel) nuevos.forEach((l, i) => setTimeout(() => { toast(`${l.e} Logro desbloqueado: <b>${l.n}</b> · +50 XP`, 'big'); confetti(innerWidth / 2, 90, 70); }, 700 + i * 1100));
  }
  if (g.nivel > seen.nivel) { const lv = g.nivel; seen.nivel = lv; if (cel) setTimeout(() => abrirNivel(lv), 1100 + nuevos.length * 1100); }
  else if (g.nivel < seen.nivel) seen.nivel = g.nivel;
  save(K.seen, seen);
  if (cel) renderHeader();
}
function toast(html, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || ''); t.innerHTML = html;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, kind === 'big' ? 3200 : 2600);
}
function xpFloat(x, y, txt) {
  const d = document.createElement('div'); d.className = 'xpf'; d.textContent = txt;
  d.style.left = x + 'px'; d.style.top = y + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 1200);
}
const conf = { parts:[], run:false };
function confetti(x, y, count = 60, colors) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), dpr = window.devicePixelRatio || 1;
  if (!conf.run) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  colors = colors || ['#6C5CE7', '#00C2A8', '#FFB020', '#FF4D6A', '#4DABF7', '#F06595', '#FF7A1A'];
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 8;
    conf.parts.push({ x:x * dpr, y:y * dpr, vx:Math.cos(a) * s * dpr, vy:(Math.sin(a) * s - 7) * dpr, g:.28 * dpr,
      w:(5 + Math.random() * 6) * dpr, h:(3 + Math.random() * 5) * dpr, r:Math.random() * 6, vr:(Math.random() - .5) * .45,
      c:colors[i % colors.length], life:70 + Math.random() * 50 });
  }
  if (!conf.run) { conf.run = true; requestAnimationFrame(confTick); }
}
function confTick() {
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  conf.parts = conf.parts.filter(p => p.life > 0 && p.y < cv.height + 60);
  for (const p of conf.parts) {
    p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  if (conf.parts.length) requestAnimationFrame(confTick); else { conf.run = false; ctx.clearRect(0, 0, cv.width, cv.height); }
}

/* ---------- Acciones ---------- */
function stepReg(h, f, d) {
  const r = getReg(h.id, f);
  if (!r && d < 0) return;
  const v = r ? num(r.valor) : 0, inc = h.incremento || 1;
  const nv = Math.max(0, r2(v + d * inc));
  if (r && nv === v) return;
  let ex = r && r.extra !== '' ? num(r.extra) : 0;
  if (h.extraEtiqueta && h.extraPorUnidad) ex = Math.max(0, r2(ex + (nv - v) / inc * h.extraPorUnidad));
  if (nv === 0 && h.direccion !== 'max' && !(r && r.nota)) { delReg(h, f); return; }
  setReg(h, f, nv, h.extraEtiqueta ? ex : (r ? r.extra : ''));
}
const A = {
  fecha: el => { ui.fecha = el.dataset.f; render(); },
  irHoy: () => { ui.fecha = today(); render(); },
  nuevo: () => abrirWizard(null),
  cerrar: () => closeSheet(),
  detalle: (el, h) => { if (!h) return; ui.detId = h.id; openSheet('detalle'); },
  check: (el, h) => accion(el, h, ui.fecha, () => { const f = ui.fecha; if (dayStatus(h, f) === 'ok') delReg(h, f); else setReg(h, f, 1); }),
  evitar: (el, h) => accion(el, h, ui.fecha, () => { const f = ui.fecha, v = +el.dataset.v, r = getReg(h.id, f); if (r && num(r.valor) === v) delReg(h, f); else setReg(h, f, v); }),
  mas: (el, h) => accion(el, h, ui.fecha, () => stepReg(h, ui.fecha, 1)),
  menos: (el, h) => accion(el, h, ui.fecha, () => stepReg(h, ui.fecha, -1)),
  cero: (el, h) => accion(el, h, ui.fecha, () => setReg(h, ui.fecha, 0, h.extraEtiqueta ? 0 : '')),
  editar: (el, h) => abrirEditor(h, ui.fecha),
  dia: (el, h) => abrirEditor(h, el.dataset.f),
  // editor
  edSet: el => { ui.ed.valor = +el.dataset.v; renderSheet(); },
  edStep: el => { const h = habitById(ui.ed.id); const v = num(ui.ed.valor), inc = h.incremento || 1, nv = Math.max(0, r2(v + (+el.dataset.d) * inc));
    if (h.extraEtiqueta && h.extraPorUnidad) ui.ed.extra = Math.max(0, r2(num(ui.ed.extra) + (nv - v) / inc * h.extraPorUnidad));
    ui.ed.valor = nv; renderSheet(); },
  edVal: el => { ui.ed.valor = +el.dataset.v; renderSheet(); },
  edExtra: el => { ui.ed.extra = Math.max(0, r2(num(ui.ed.extra) + (+el.dataset.d))); renderSheet(); },
  edCerrar: () => edSalir(),
  edBorrar: () => { const h = habitById(ui.ed.id); delReg(h, ui.ed.f); toast('Registro borrado'); edSalir(); },
  edGuardar: el => {
    const e = ui.ed, h = habitById(e.id), f = e.f;
    accion(el, h, f, () => {
      if (h.tipo === 'check') { if (!num(e.valor)) { if (e.existe) delReg(h, f); } else setReg(h, f, num(e.valor), '', e.nota); }
      else {
        const v = Math.max(0, num(e.valor)), ex = e.extra === '' ? '' : Math.max(0, num(e.extra));
        if (v === 0 && h.direccion !== 'max' && !e.nota && !ex) { if (e.existe) delReg(h, f); }
        else setReg(h, f, v, h.extraEtiqueta ? ex : '', e.nota);
      }
    });
    edSalir();
  },
  // detalle
  hEditar: (el, h) => abrirWizard(h),
  hArchivar: (el, h) => { commit({ t:'habito', h:{ ...h, archivado:true, actualizado:new Date().toISOString() } }); closeSheet(); toast(`🗄️ "${esc(h.nombre)}" archivado. Lo encuentras en Ajustes.`); },
  hRestaurar: (el, h) => { commit({ t:'habito', h:{ ...h, archivado:false, actualizado:new Date().toISOString() } }); render(); toast(`${esc(h.emoji)} "${esc(h.nombre)}" de vuelta`); },
  hBorrar: (el, h) => { if (!h) return; if (!confirm(`¿Eliminar "${h.nombre}" y todo su historial?\nNo se puede deshacer. Si solo quieres pausarlo, mejor archívalo.`)) return;
    commit({ t:'borrarHabito', id:h.id }); closeSheet(); render(); toast('Hábito eliminado'); },
  // asistente
  paso: el => { const p = +el.dataset.p; if (ui.paso === 2 && p > 2 && !String(ui.draft.nombre || '').trim()) { toast('Ponle un nombre a tu hábito 🙂'); return; }
    ui.paso = Math.max(0, Math.min(4, p)); renderSheet(false); $('#sheet-body').scrollTop = 0; },
  plantilla: el => { ui.draft = { ...DRAFT0(), ...PLANTILLAS[+el.dataset.i] }; ui.draft._extra = !!ui.draft.extraEtiqueta; ui.paso = 4; renderSheet(false); $('#sheet-body').scrollTop = 0; },
  wPol: el => { ui.draft.polaridad = el.dataset.v; ui.draft.direccion = el.dataset.v === 'dejar' ? 'max' : 'min'; if (!ui.editando) { ui.paso = 2; $('#sheet-body').scrollTop = 0; } renderSheet(); },
  wTipo: el => { const d = ui.draft, v = el.dataset.v, prev = d.tipo; d.tipo = v;
    if (v !== prev) {
      if (v === 'tiempo') { d.unidad = 'min'; d.meta = d.polaridad === 'dejar' ? 60 : 30; d.incremento = 15; }
      else if (v === 'cantidad') { if (d.unidad === 'min') d.unidad = ''; d.meta = d.polaridad === 'dejar' ? 2 : 5; d.incremento = 1; }
    }
    if (!ui.editando) { ui.paso = 4; $('#sheet-body').scrollTop = 0; } renderSheet(); },
  wEmoji: el => { ui.draft.emoji = el.dataset.v; renderSheet(); },
  wColor: el => { ui.draft.color = el.dataset.v; renderSheet(); },
  wDir: el => { ui.draft.direccion = el.dataset.v; renderSheet(); },
  wExtra: () => { const d = ui.draft; d._extra = !d._extra; if (d._extra && !d.extraPorUnidad) d.extraPorUnidad = 1; renderSheet(); },
  wStep: el => { const d = ui.draft, f = el.dataset.f, dir = +el.dataset.d;
    const stepOf = { meta: d.tipo === 'tiempo' ? 5 : (d.incremento >= 10 ? d.incremento : 1), incremento: d.tipo === 'tiempo' ? 5 : (d.incremento >= 100 ? 100 : d.incremento >= 10 ? 5 : 1), extraPorUnidad: .5 }[f];
    const minOf = { meta: d.direccion === 'max' ? 0 : 1, incremento: 1, extraPorUnidad: 0 }[f];
    d[f] = Math.max(minOf, r2(num(d[f]) + dir * stepOf)); renderSheet(); },
  wDia: el => { const d = ui.draft, c = el.dataset.v; if (d.dias.includes(c)) { if (d.dias.length === 1) { toast('Debe quedar al menos un día'); return; } d.dias = d.dias.replace(c, ''); } else d.dias += c; renderSheet(); },
  wDias: el => { ui.draft.dias = el.dataset.v; renderSheet(); },
  wRacha: el => { ui.draft.rachaObjetivo = +el.dataset.v; renderSheet(); },
  wGuardar: () => wGuardar(),
  // sincronización y datos
  syncBtn: () => sync(true),
  syncManual: () => sync(true),
  exportar: () => {
    const blob = new Blob([JSON.stringify({ exportado:new Date().toISOString(), habitos:state.habitos, registros:Object.values(state.registros), pendientes:queue }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `habitos-respaldo-${today()}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  },
  reset: () => {
    const extra = queue.length ? `\n\nOjo: hay ${queue.length} cambio(s) que aún no se suben a Google Sheets y se perderán.` : '';
    if (!confirm('¿Borrar los datos guardados en este teléfono?' + extra)) return;
    state = { habitos:[], registros:{} }; queue = []; save(K.state, state); save(K.queue, queue);
    render(); toast('Datos locales borrados'); if (cfg.url) sync(true);
  }
};

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.vista = tab.dataset.tab; render(); scrollTo(0, 0); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = A[el.dataset.action]; if (!fn) return;
  const h = el.dataset.id ? habitById(el.dataset.id) : null;
  fn(el, h, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && ui.draft) ui.draft[t.dataset.f] = t.type === 'number' ? num(t.value) : t.value;
  if (t.dataset.ed && ui.ed) ui.ed[t.dataset.ed] = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset.cfg) return;
  const k = t.dataset.cfg; cfg[k] = t.value.trim();
  const { url, token, ...guardar } = cfg; save(K.cfg, guardar);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
document.addEventListener('touchstart', () => {}, { passive:true });
addEventListener('online', () => { updateSyncUI(); sync(); });
addEventListener('offline', updateSyncUI);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = today();
  if (ui.lastToday !== t) { if (ui.fecha === ui.lastToday) ui.fecha = t; ui.lastToday = t; render(); }
  sync();
});
setInterval(() => { if (queue.length && !syncing) sync(); }, 45000);

/* ---------- Inicio ---------- */
render();
checkProgress(false);
sync();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
